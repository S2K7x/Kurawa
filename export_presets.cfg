; Presets d'export Kurawa — Mac, Web et iOS (voir CLAUDE.md > Exporter).
; Les Tests/ et les références visuelles ne partent jamais dans un build.
; Godot complète les options manquantes avec ses valeurs par défaut à l'ouverture du projet.

[preset.0]

name="Mac"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="Tests/*, Design-Style/*"
export_path="build/mac/Kurawa.app"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

application/name="Kurawa"
application/bundle_identifier="com.shaikrief.kurawa"
application/short_version="0.1.0"
application/version="0.1.0"
application/copyright="Shai Krief"
application/icon="res://icon.svg"
display/high_res=true
codesign/codesign=0
notarization/notarization=0

[preset.1]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="Tests/*, Design-Style/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
; Sans isolation cross-origin (itch.io, hébergement statique simple), les threads sont
; indisponibles : on exporte donc en mono-thread.
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true

[preset.2]

name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="Tests/*, Design-Style/*"
export_path="build/ios/Kurawa.xcodeproj"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

application/app_store_team_id=""
application/bundle_identifier="com.shaikrief.kurawa"
application/short_version="0.1.0"
application/version="0.1.0"
application/signature=""
application/min_ios_version="13.0"
application/targeted_device_family=0
capabilities/access_wifi=false
capabilities/push_notifications=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
; Portrait uniquement, dans les deux sens : le jeu se joue à une main (GDD > Format).
orientation/portrait=true
orientation/landscape_left=false
orientation/landscape_right=false
orientation/portrait_upside_down=true
